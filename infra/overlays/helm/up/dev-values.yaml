replicaCount: 1
resources:
  limits:
    memory: 256Mi
# Dev-specific env vars (e.g., sandbox API keys)
extraEnv:
  NODE_ENV: development

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api-dev.up.<LB_IP>.nip.io   # Replace <LB_IP> with your cluster LB IP
      paths:
        - path: /
          pathType: Prefix
