
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: up-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/divhanimajokweni-ctrl/you-are-the-lead-systems-engineer-responsible-for-generating-code-for-the-ubuntu-pools-platform.-you.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - ../overlays/helm/up/production-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: up-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
