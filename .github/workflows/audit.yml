name: Continuous Audit

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      entityType:
        description: 'Entity type to audit'
        required: false
        default: ''
      entityId:
        description: 'Specific entity ID to audit'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'packages/ledger/**'
      - 'packages/villages/**'
  pull_request:
    paths:
      - 'packages/ledger/**'
      - 'packages/villages/**'

env:
  BUN_VERSION: latest

jobs:
  hash-chain-verification:
    name: Hash Chain Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ledger tests for chain integrity
        run: |
          bun test packages/ledger/src/invariants.test.ts
        continue-on-error: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
        continue-on-error: true

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  compliance-gates:
    name: Compliance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck
        continue-on-error: true

      - name: Run lint
        run: bun run lint
        continue-on-error: true

      - name: Run tests
        run: bun run test
        continue-on-error: true

      - name: Run villages spine tests
        run: |
          bun test packages/villages/src/spine.test.ts
        continue-on-error: true

  incident-check:
    name: Check for open incidents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for security incidents
        run: |
          bun test packages/security --run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

  cosign-signature:
    name: Sign releases with Cosign
    runs-on: ubuntu-latest
    needs: [hash-chain-verification, compliance-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        run: |
          cosign sign --key cosign.key ${{ github.sha }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        continue-on-error: true

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [hash-chain-verification, compliance-gates, cosign-signature]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  audit-summary:
    name: Audit Summary
    needs: [hash-chain-verification, compliance-gates, incident-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate audit report
        run: |
          echo "## Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hash Chain Verification" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.hash-chain-verification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Compliance Gates" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.compliance-gates.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Incident Check" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.incident-check.result }}" >> $GITHUB_STEP_SUMMARY