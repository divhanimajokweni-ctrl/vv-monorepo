name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared-kernel
        run: npm run build --workspace=packages/shared-kernel

      - name: Run tests
        run: npm run test:integration

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_POOLS }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./apps/ubuntu-pools-api
          vercel-args: '--prod'

      - name: Health check
        run: |
          sleep 30
          curl -f ${{ secrets.PROD_HEALTH_URL }} || exit 1

      - name: Run waitlist import
        run: npm run db:seed -- --waitlist-import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
