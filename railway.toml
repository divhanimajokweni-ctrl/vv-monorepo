[services.safekrypte]
source = "packages/safekrypte"
healthcheckPath = "/sign"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services.safestakes]
source = "packages/safestakes"
healthcheckPath = "/execute-slash"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10