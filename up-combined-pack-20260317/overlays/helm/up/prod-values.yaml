# Ubuntu Pools — Production Overlay (South Africa: nip.io DNS)
replicaCount: 3

image:
  tag: "stable"

ingress:
  hosts:
    - host: up.54.76.201.220.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ubuntu-pools-tls
      hosts:
        - up.54.76.201.220.nip.io

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20

env:
  - name: NODE_ENV
    value: "production"
  - name: NEXT_TELEMETRY_DISABLED
    value: "1"
  - name: LOG_LEVEL
    value: "warn"

lindiwe:
  internalUrl: "http://lindiwe-ai.up-production.svc.cluster.local"
