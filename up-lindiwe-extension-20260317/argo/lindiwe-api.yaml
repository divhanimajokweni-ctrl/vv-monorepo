# ── Lindiwe AI — Kubernetes Manifests ────────────────────────────────────
# Managed by ArgoCD. Namespace: up-dev (dev) | up-production (prod)

# ── ConfigMap ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: lindiwe-ai-config
  namespace: up-dev
  labels:
    app: lindiwe-ai
    app.kubernetes.io/part-of: ubuntu-pools
data:
  LOG_LEVEL: "INFO"
  BASE_INTEREST_RATE: "15.0"
  MIN_INTEREST_RATE: "5.0"
  ADJUST_THRESHOLD: "700"
  VILLAGE_BOOST_THRESHOLD: "0.95"
  ALLOWED_ORIGINS: "https://up.dev.REPLACE_LB_IP.nip.io"

---
# ── Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lindiwe-ai
  namespace: up-dev
  labels:
    app: lindiwe-ai
    app.kubernetes.io/part-of: ubuntu-pools
    app.kubernetes.io/version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lindiwe-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lindiwe-ai
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: lindiwe-ai
          image: ghcr.io/divhanimajokweni-ctrl/up-lindiwe-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lindiwe-ai-config
          env:
            - name: UBUNTU_BACKBONE_URL
              value: "http://ubuntu-backbone-api.up-dev.svc.cluster.local"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /v1/lindiwe/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/lindiwe/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-pull-secret

---
# ── Service ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: lindiwe-ai
  namespace: up-dev
  labels:
    app: lindiwe-ai
    app.kubernetes.io/part-of: ubuntu-pools
spec:
  type: ClusterIP
  selector:
    app: lindiwe-ai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000

---
# ── Ingress ───────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lindiwe-ai
  namespace: up-dev
  labels:
    app: lindiwe-ai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: lindiwe.up.dev.REPLACE_LB_IP.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lindiwe-ai
                port:
                  number: 80

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lindiwe-ai
  namespace: up-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lindiwe-ai
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
